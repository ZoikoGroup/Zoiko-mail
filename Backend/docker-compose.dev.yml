# Local development only — explicit opt-in, never auto-loaded.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# That starts Postgres only. Locally the API runs from source (npm run dev,
# via scripts/dev-up.ps1); the api container is an image built at some past
# date, and starting it by accident put old code on port 5000 ("Route ... not
# found" for anything newer than the image). It is behind the docker-api
# profile here, so it starts only when asked for by name — which is what
# `dev-up.ps1 -Docker` does (`build api`, `up -d api`) — or with
# `--profile docker-api`.
#
# Publishes Postgres to the host so local tooling (prisma migrate, studio, the
# test suite) can reach it. The base compose file deliberately does not, because
# Infrastructure §8 requires private database connectivity with "no public
# database access from unmanaged clients" — that rule is for deployed
# environments, not a developer workstation.
#
# Named docker-compose.dev.yml rather than docker-compose.override.yml so it is
# never picked up implicitly by a deployment that happens to run `compose up`.
services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  api:
    # Opt-in locally; see the note at the top of this file.
    profiles: ["docker-api"]
    environment:
      LOG_LEVEL: debug
      # Rate limits sized for one developer signing in, out and in again all
      # day. The production defaults (100 requests and 20 sign-ins per 15
      # minutes per IP) lock a developer out for a quarter of an hour, and
      # every request from this machine shares one IP. Raised here only: this
      # file is never loaded by a deployment. Override any of them in .env.
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100000}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10000}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-10000}
      REFRESH_RATE_LIMIT_MAX: ${REFRESH_RATE_LIMIT_MAX:-10000}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-10000}
      INVITATION_RATE_LIMIT_MAX: ${INVITATION_RATE_LIMIT_MAX:-10000}
