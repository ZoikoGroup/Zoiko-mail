name: Security

# Infrastructure §13 "Security" stage: SAST, dependency vulnerability scan,
# secret scan and IaC scan. Blocking condition is any unresolved critical or
# high finding (§5 non-negotiable: "No production deploy without automated
# tests, security checks and release approval").

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Dependency advisories land continuously; a weekly sweep catches issues in
    # code that has not changed.
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ── SAST ───────────────────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ── Dependency vulnerabilities ─────────────────────────────────────────
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [Backend, Frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

  # ── Secret scanning ────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Infrastructure as Code ─────────────────────────────────────────────
  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform format check
        run: |
          if [ -d infra/terraform ]; then
            docker run --rm -v "$PWD/infra/terraform:/wd" -w /wd \
              hashicorp/terraform:1.9 fmt -check -recursive
          else
            echo "infra/terraform not present yet — skipping"
          fi
      - name: Terraform validate
        run: |
          if [ -d infra/terraform/envs/dev ]; then
            docker run --rm -v "$PWD/infra/terraform:/wd" -w /wd/envs/dev \
              hashicorp/terraform:1.9 init -backend=false
            docker run --rm -v "$PWD/infra/terraform:/wd" -w /wd/envs/dev \
              hashicorp/terraform:1.9 validate
          else
            echo "infra/terraform/envs/dev not present yet — skipping"
          fi
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          skip_check: CKV_GCP_49
