services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoiko_mail
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - zoiko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko -d zoiko_mail"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://zoiko:${POSTGRES_PASSWORD}@postgres:5432/zoiko_mail?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      OPERATIONS_KEY: ${OPERATIONS_KEY:?Set OPERATIONS_KEY}
      PROVIDER_CALLBACK_SECRET: ${PROVIDER_CALLBACK_SECRET:?Set PROVIDER_CALLBACK_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      # Google as an identity provider. Optional: unset means the sign-in
      # route reports itself unconfigured instead of failing at startup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ATTACHMENT_STORAGE_PATH: /app/storage/attachments
      EXPORT_STORAGE_PATH: /app/storage/exports
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_PROVIDER_ENABLED: ${MAIL_PROVIDER_ENABLED:-false}
      # System mail carries OTP and security notices. Separate from the
      # tenant provider-mail pipeline, which is warm-up limited and must not
      # send auth email. Defaults are non-empty because env.ts validates
      # SYSTEM_MAIL_ENABLED as an enum and SYSTEM_MAIL_FROM as an email.
      SYSTEM_MAIL_ENABLED: ${SYSTEM_MAIL_ENABLED:-false}
      SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-no-reply@zoikomail.com}
      IMAP_HOST: ${IMAP_HOST:-imap.secureserver.net}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-smtpout.secureserver.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_PROVIDER_USERNAME: ${MAIL_PROVIDER_USERNAME:-}
      MAIL_PROVIDER_PASSWORD: ${MAIL_PROVIDER_PASSWORD:-}
      MAIL_PROVIDER_FROM_ADDRESS: ${MAIL_PROVIDER_FROM_ADDRESS:-}
      MAIL_PROVIDER_TENANT_ID: ${MAIL_PROVIDER_TENANT_ID:-}
      MAIL_PROVIDER_MEMBERSHIP_ID: ${MAIL_PROVIDER_MEMBERSHIP_ID:-}
      MAIL_PROVIDER_SYNC_INTERVAL_MS: ${MAIL_PROVIDER_SYNC_INTERVAL_MS:-300000}
      MAIL_PROVIDER_CONNECTION_TIMEOUT_MS: ${MAIL_PROVIDER_CONNECTION_TIMEOUT_MS:-15000}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - zoiko_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  zoiko_postgres_data:
  zoiko_storage:
