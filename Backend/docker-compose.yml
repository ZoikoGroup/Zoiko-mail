services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoiko_mail
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - zoiko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko -d zoiko_mail"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://zoiko:${POSTGRES_PASSWORD}@postgres:5432/zoiko_mail?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      OPERATIONS_KEY: ${OPERATIONS_KEY:?Set OPERATIONS_KEY}
      PROVIDER_CALLBACK_SECRET: ${PROVIDER_CALLBACK_SECRET:?Set PROVIDER_CALLBACK_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      # Google as an identity provider. Optional: unset means the sign-in
      # route reports itself unconfigured instead of failing at startup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Without this the container falls back to env.ts's default of false and
      # POST /auth/google answers 403, which reads like a broken button.
      FLAG_GOOGLE_LOGIN_ENABLED: ${FLAG_GOOGLE_LOGIN_ENABLED:-false}
      ATTACHMENT_STORAGE_PATH: /app/storage/attachments
      EXPORT_STORAGE_PATH: /app/storage/exports
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_PROVIDER_ENABLED: ${MAIL_PROVIDER_ENABLED:-false}
      # System mail carries OTP and security notices. Separate from the
      # tenant provider-mail pipeline, which is warm-up limited and must not
      # send auth email. Defaults are non-empty because env.ts validates
      # SYSTEM_MAIL_ENABLED as an enum and SYSTEM_MAIL_FROM as an email.
      SYSTEM_MAIL_ENABLED: ${SYSTEM_MAIL_ENABLED:-false}
      SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-no-reply@zoikomail.com}
      IMAP_HOST: ${IMAP_HOST:-imap.secureserver.net}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-smtpout.secureserver.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_PROVIDER_USERNAME: ${MAIL_PROVIDER_USERNAME:-}
      MAIL_PROVIDER_PASSWORD: ${MAIL_PROVIDER_PASSWORD:-}
      MAIL_PROVIDER_FROM_ADDRESS: ${MAIL_PROVIDER_FROM_ADDRESS:-}
      MAIL_PROVIDER_TENANT_ID: ${MAIL_PROVIDER_TENANT_ID:-}
      MAIL_PROVIDER_MEMBERSHIP_ID: ${MAIL_PROVIDER_MEMBERSHIP_ID:-}
      MAIL_PROVIDER_SYNC_INTERVAL_MS: ${MAIL_PROVIDER_SYNC_INTERVAL_MS:-300000}
      MAIL_PROVIDER_CONNECTION_TIMEOUT_MS: ${MAIL_PROVIDER_CONNECTION_TIMEOUT_MS:-15000}
      # Hosted mailboxes (Create Email). The API key is not passed here: it is
      # read from the secret store (STALWART_API_TOKEN_REF), which with
      # SECRET_STORE=env is a file under SECRET_FILE_DIR on the storage volume.
      STALWART_ENABLED: ${STALWART_ENABLED:-false}
      STALWART_BASE_URL: ${STALWART_BASE_URL:-}
      STALWART_API_TOKEN_REF: ${STALWART_API_TOKEN_REF:-stalwart-api-token}
      STALWART_TIMEOUT_MS: ${STALWART_TIMEOUT_MS:-15000}
      STALWART_AUTO_CREATE_DOMAINS: ${STALWART_AUTO_CREATE_DOMAINS:-true}
      # Empty: new accounts get Stalwart's built-in User role. Otherwise the id
      # of a custom role (see docs/DEPLOYMENT.md).
      STALWART_ACCOUNT_ROLE_ID: ${STALWART_ACCOUNT_ROLE_ID:-}
      # Off until the staging checks in docs/DEPLOYMENT.md pass.
      STALWART_DELETE_ENABLED: ${STALWART_DELETE_ENABLED:-false}
      MAIL_CLEANUP_INTERVAL_MS: ${MAIL_CLEANUP_INTERVAL_MS:-30000}
      MAIL_CLEANUP_LEASE_MS: ${MAIL_CLEANUP_LEASE_MS:-300000}
      MAIL_CLEANUP_RETENTION_DAYS: ${MAIL_CLEANUP_RETENTION_DAYS:-90}
      # The container receives only the variables named in this file, so a
      # setting that is not listed here never reaches the API, whatever the
      # server's .env says.
      #
      # Zoiko as the mail store (decision D1). false: Create Email makes the
      # mailbox in Zoiko and does not ask Stalwart for an account. true (the
      # default) keeps the mail-server behaviour.
      STALWART_ACCOUNT_PROVISIONING: ${STALWART_ACCOUNT_PROVISIONING:-true}
      # The address an invitation link points at. Must be the public site.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Outbound relay (decision D2): sends to outside recipients through an
      # authenticated SMTP relay (Amazon SES, Brevo). Off until configured.
      RELAY_ENABLED: ${RELAY_ENABLED:-false}
      RELAY_SMTP_HOST: ${RELAY_SMTP_HOST:-}
      RELAY_SMTP_PORT: ${RELAY_SMTP_PORT:-587}
      RELAY_SMTP_SECURE: ${RELAY_SMTP_SECURE:-false}
      RELAY_SMTP_USERNAME: ${RELAY_SMTP_USERNAME:-}
      RELAY_SMTP_PASSWORD: ${RELAY_SMTP_PASSWORD:-}
      # Inbound mail (decision D1): the shared secret the edge (the Cloudflare
      # Email Worker) signs messages with. Unset, the inbound endpoint answers
      # 503 and no outside mail is accepted. At least 32 characters.
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}
      # Where secrets live: DKIM private keys, DNS provider credentials and
      # connector tokens. The file store's default is inside the image, which
      # a rebuild wipes — so it sits on the persistent storage volume here.
      # Production should use SECRET_STORE=gcp (Secret Manager) instead.
      SECRET_STORE: ${SECRET_STORE:-env}
      SECRET_FILE_DIR: ${SECRET_FILE_DIR:-/app/storage/secrets}
      SECRET_MANAGER_PROJECT: ${SECRET_MANAGER_PROJECT:-}
      # Custom-domain DNS. The MX hosts and SPF include must be real
      # platform infrastructure: every customer domain is told to point at
      # them, and the SPF include must publish the sending IPs itself.
      DNS_MX_HOSTS: ${DNS_MX_HOSTS:-mail.zoikomail.com:10}
      DNS_SPF_INCLUDE: ${DNS_SPF_INCLUDE:-_spf.zoikomail.com}
      DNS_SPF_ALL: ${DNS_SPF_ALL:-~all}
      DNS_DKIM_SELECTOR_PREFIX: ${DNS_DKIM_SELECTOR_PREFIX:-zm}
      DNS_DKIM_KEY_BITS: ${DNS_DKIM_KEY_BITS:-2048}
      DNS_DMARC_RUA: ${DNS_DMARC_RUA:-}
      DNS_AUTOCONFIG_HOST: ${DNS_AUTOCONFIG_HOST:-}
      DNS_RESOLVER_SERVERS: ${DNS_RESOLVER_SERVERS:-}
      DNS_SYNC_INTERVAL_MS: ${DNS_SYNC_INTERVAL_MS:-30000}
      DNS_RECHECK_VERIFIED_MS: ${DNS_RECHECK_VERIFIED_MS:-21600000}
      DNS_FAILURE_THRESHOLD: ${DNS_FAILURE_THRESHOLD:-3}
      DNS_VERIFICATION_WINDOW_HOURS: ${DNS_VERIFICATION_WINDOW_HOURS:-72}
      # Everything below is optional. Each `${VAR:-}` is read by env.ts through
      # blankAsUndefined, so an empty value means "not configured" exactly as
      # an unset one does. Variables env.ts validates as an enum, a boolean or
      # a non-empty string with a default get that default here instead, so
      # they are never passed as "".
      #
      # Gmail connector (authorization-code flow) and the browser sign-in
      # client id. The secret and redirect URI require GOOGLE_CLIENT_ID too.
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_SIGNIN_CLIENT_ID: ${GOOGLE_SIGNIN_CLIENT_ID:-}
      # Unset, Gmail watch is skipped and sync runs on the catch-up interval.
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      # Microsoft 365 connector. Optional until the app is provisioned.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_NOTIFICATION_URL: ${MICROSOFT_NOTIFICATION_URL:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      # At least 8 characters; env.ts rejects an empty value.
      MICROSOFT_NOTIFICATION_CLIENT_STATE: ${MICROSOFT_NOTIFICATION_CLIENT_STATE:-zoiko-connector-beta}
      # Stripe billing (test mode). Checkout, portal and webhook fail closed
      # until configured.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # AI extraction. "mock" makes no external calls; "openai" needs
      # OPENAI_API_KEY.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Connector tokens at rest (AES-256-GCM): 64 hex characters when set.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Fallback project for SECRET_STORE=gcp when SECRET_MANAGER_PROJECT is
      # unset. Read straight from process.env; empty is treated as missing.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      FLAG_MFA_ENFORCEMENT_ENABLED: ${FLAG_MFA_ENFORCEMENT_ENABLED:-true}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - zoiko_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  zoiko_postgres_data:
  zoiko_storage:
