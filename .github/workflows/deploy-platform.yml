name: Deploy platform

on:
  workflow_dispatch:

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PLATFORM_HOST }}
          username: ${{ secrets.PLATFORM_USER }}
          key: ${{ secrets.PLATFORM_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin:/snap/bin"
            zoikomail-deploy
            for i in 1 2 3 4 5 6; do
              if curl -fsS https://api.zoikomail.com/api/ready | grep -q READY; then
                echo "API ready"
                exit 0
              fi
              sleep 10
            done
            echo "API not ready after 60 seconds"
            exit 1
