name: CI

# Infrastructure §13: every artifact that reaches an environment comes from a
# pipeline, never from a developer's machine. This is the gate that makes that
# true — it runs on the pull request, so a contract change cannot merge on the
# strength of someone having run the suite locally once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, vivekkumar]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Cheap checks first. A capability that exists on one side of the wire and
  # not the other is a broken control, and it costs two seconds to catch here
  # rather than in a screenshot that looks fine.
  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The checker lives in Backend/scripts rather than beside this file:
      # the repository is meant to be two folders, and the only thing that has
      # to sit at the root is the workflow itself — GitHub Actions reads
      # workflows from .github/workflows at the root of the default branch and
      # nowhere else. A workflow moved into Backend/ or Frontend/ is simply
      # never run, with no error to say so.
      - name: Frontend and backend agree on the capability vocabulary
        run: node Backend/scripts/check-capability-parity.mjs

      # A merge that leaves markers behind compiles in neither language, but
      # it has reached a branch here before, so it is worth one grep.
      - name: No conflict markers
        run: |
          if grep -rEn '^(<<<<<<< |>>>>>>> |={7}$)' \
               --include='*.ts' --include='*.tsx' --include='*.prisma' --include='*.sql' \
               Backend/src Backend/prisma Frontend/app Frontend/lib Frontend/components; then
            echo "::error::Conflict markers found"
            exit 1
          fi
          echo "clean"

      # The repository is two folders. Anything else at the root is either a
      # build artifact or something that should live inside one of them.
      - name: Repository is Backend and Frontend
        run: |
          unexpected=$(ls -A | grep -vE '^(Backend|Frontend|README\.md|\.git|\.github|\.gitignore)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::warning::Unexpected root entries: $unexpected"
          fi
          echo "root checked"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [Backend, Frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.workspace }}

      # The client is generated, and half the backend's types come from it.
      - name: Generate Prisma client
        if: matrix.workspace == 'Backend'
        run: npx prisma generate
        working-directory: Backend

      - name: Typecheck
        run: npm run ${{ matrix.workspace == 'Backend' && 'type-check' || 'typecheck' }}
        working-directory: ${{ matrix.workspace }}

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: [contract]
    # The suite runs against a real PostgreSQL rather than mocks. It is slower
    # for it and catches what matters: a missing tenant filter, a migration
    # that does not apply, a capability that resolves the wrong way.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: zoiko_mail_test
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoiko -d zoiko_mail_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://zoiko:ci_password@localhost:5432/zoiko_mail_test?schema=public
      DATABASE_URL: postgresql://zoiko:ci_password@localhost:5432/zoiko_mail_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-chars-different
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - run: npm ci
        working-directory: Backend
      - run: npx prisma generate
        working-directory: Backend

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: Backend

      # Drift is silent until a deploy fails. Comparing the schema against the
      # migrations that claim to build it is the only thing that catches a
      # model edited without a migration.
      - name: No schema drift
        working-directory: Backend
        run: |
          diff=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma --script)
          if echo "$diff" | grep -qv -e '^--' -e '^$' -e 'empty migration'; then
            echo "::error::schema.prisma does not match the applied migrations"
            echo "$diff"
            exit 1
          fi
          echo "no drift"

      - name: Test suite
        working-directory: Backend
        run: npm test

  frontend-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
        working-directory: Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend

      # These specs stub the network and assert on what the browser sends, so
      # they need no API — a screen that renders a decision and never tells the
      # server is the class of bug they exist for.
      - name: Playwright
        run: npm run test:e2e
        working-directory: Frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: Frontend/playwright-report
          retention-days: 7

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [typecheck, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      # Built once, here. Infrastructure §13: "Cloud Run services deploy
      # through CI/CD with no manual production artifact upload" — so the
      # image a deploy promotes is this one, never a local build.
      - name: Build backend image
        run: docker build -t zoiko-mail-backend:${{ github.sha }} Backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - name: Build frontend
        run: npm run build
        working-directory: Frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
