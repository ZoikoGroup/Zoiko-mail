name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Infra §13 makes type checks, lint and build blocking stages before any
# deploy. This mirrors that for the frontend.
jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
